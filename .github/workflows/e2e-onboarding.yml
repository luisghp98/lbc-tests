name: E2E onboarding (preprod)

# Manual: las pruebas escriben datos QA- en preprod y los retiran al final.
# Repo público: no se suben artefactos ni se corren las @seguridad (sus fallos quedarían en logs públicos).
on:
  workflow_dispatch:
    inputs:
      carpeta:
        description: Carpeta de pruebas dentro de e2e/tests (onboarding o asistencia)
        required: false
        default: onboarding
      grep:
        description: Filtro de pruebas (opcional, ej. CP-ONB-01)
        required: false
      datos_de_pago:
        description: Ejecutar los casos de Card y ACH con datos de pago (requiere los secretos PAGO_*; por defecto no)
        required: false
        default: 'no'
      grep_invert:
        description: Pruebas a excluir (por defecto las @seguridad; pon NINGUNA para incluirlas)
        required: false
        default: '@seguridad'

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      BASE_URL: https://prelbc.juvomos.com
      API_BASE_URL: https://api.presupbase.juvomos.com
      TIMEOUT_FACTOR: '2'
      USER: ${{ secrets.LBC_USER }}
      PASSWORD: ${{ secrets.LBC_PASSWORD }}
      API_KEY: ${{ secrets.LBC_API_KEY }}
      PAGO_HABILITADO: ${{ inputs.datos_de_pago }}
      PAGO_TARJETA_NUMERO: ${{ secrets.PAGO_TARJETA_NUMERO }}
      PAGO_TARJETA_VENCIMIENTO: ${{ secrets.PAGO_TARJETA_VENCIMIENTO }}
      PAGO_TARJETA_CVV: ${{ secrets.PAGO_TARJETA_CVV }}
      PAGO_TARJETA_NUMERO_INVALIDO: ${{ secrets.PAGO_TARJETA_NUMERO_INVALIDO }}
      PAGO_ACH_TITULAR: ${{ secrets.PAGO_ACH_TITULAR }}
      PAGO_ACH_CUENTA: ${{ secrets.PAGO_ACH_CUENTA }}
      PAGO_ACH_ROUTING: ${{ secrets.PAGO_ACH_ROUTING }}
      PAGO_ACH_CUENTA_INVALIDA: ${{ secrets.PAGO_ACH_CUENTA_INVALIDA }}
      CARPETA: ${{ inputs.carpeta }}
      GREP: ${{ inputs.grep }}
      GREP_INVERT: ${{ inputs.grep_invert }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - name: Comprobar secretos (solo dice si existen)
        run: |
          faltan=""
          [ -n "$USER" ] || faltan="$faltan LBC_USER"
          [ -n "$PASSWORD" ] || faltan="$faltan LBC_PASSWORD"
          [ -n "$API_KEY" ] || faltan="$faltan LBC_API_KEY"
          if [ -n "$faltan" ]; then echo "::error::Faltan estos secretos del repositorio (Settings > Secrets and variables > Actions):$faltan"; exit 1; fi
      - name: Diagnóstico de credenciales (sin mostrar valores)
        run: |
          echo "usuario: dominio=${USER#*@} largo=${#USER}"
          echo "contraseña: largo=${#PASSWORD}"
          echo "api key: largo=${#API_KEY} empieza_por=${API_KEY:0:3}"
      - run: npm ci
      - name: Instalar el navegador, con reintentos porque los espejos de Ubuntu fallan a veces
        run: for i in 1 2 3; do npx playwright install --with-deps chromium && exit 0; echo "intento $i fallido"; sleep 20; done; exit 1
      - run: npx playwright test e2e/tests/${CARPETA:-onboarding} ${GREP_INVERT:+--grep-invert "$GREP_INVERT"} --reporter=list ${GREP:+--grep "$GREP"}
